stages:
  - build
  - test
  - deploy

commitcheck:
  stage: test
  image: 
    name: ghcr.io/cocogitto/cog:7.0.0
    entrypoint: ["/bin/sh", "-c"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /Merge branch .+ into .+[\s\S]*?See merge request/'
      when: never  # Skip post-merge pipelines
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cog check -l --ignore-merge-commits
  
pytest:
  stage: test
  image: python:3.13
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /Merge branch .+ into .+[\s\S]*?See merge request/'
      when: never  # Skip post-merge pipelines
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - pip install -q --root-user-action=ignore uv
    - uv sync --all-extras --all-groups
    - source .venv/bin/activate
    - pre-commit run --all-files --show-diff-on-failure
    - basedpyright --gitlabcodequality report.json
    - basedpyright tests
    - pytest --cov=typed_lisa_toolkit --cov-branch --cov-report=term-missing
        --cov-report=xml:coverage.xml --junitxml=report.xml 
        --cov-fail-under=85 -m "not slow"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - coverage.xml
      - report.xml
      - report.json
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      codequality: report.json
    expire_in: 1 week

pages:
  stage: deploy
  image: python:3.13
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:-[A-Za-z-]+\.?\d+)?$/'
    - when: never
  script:
    - pip install -q --root-user-action=ignore uv
    - uv sync --group doc
    - source .venv/bin/activate
    - make -C docs clean html
    - mv docs/_build/html public
    - anybadge -l documentation -v latest -f documentation.svg -c green
  artifacts:
    paths:
      - public
      - documentation.svg
    expire_in: 1 week

build:
  stage: build
  image: python:3.13
  script:
    - pip install -q --root-user-action=ignore uv
    - uv build --sdist --wheel --no-sources
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:-[A-Za-z-]+\.?\d+)?$/'
    - when: never

pypi:
  stage: deploy
  image: python:3.13
  variables:
    TWINE_USERNAME: "$PYPI_USERNAME"
    TWINE_PASSWORD: "$PYPI_PASSWORD"
    TWINE_REPOSITORY: "$PYPI_REPOSITORY"
  dependencies:
    - build

  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:-(rc|preview|pre)\.?\d+)?$/'
    - when: never
  script:
    - pip install -q --root-user-action=ignore uv twine
    - uv sync --group dev
    - source .venv/bin/activate
    - twine upload --verbose dist/*


gitlab-pypi:
  stage: deploy
  image: python:3.13
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  dependencies:
    - build

  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:-[A-Za-z-]+\.?\d+)?$/'
    - when: never
  script:
    - pip install -q --root-user-action=ignore uv twine
    - uv sync --group dev
    - source .venv/bin/activate
    - twine upload --verbose --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
